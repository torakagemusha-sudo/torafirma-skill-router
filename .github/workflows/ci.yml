name: C++ contract tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / GCC
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skill-router
    steps:
      - uses: actions/checkout@v4
      - name: Build and run C++ and C ABI tests
        run: |
          make clean
          make test
      - name: Build router and C ABI libraries
        run: |
          make
          make capi
      - name: Run end-to-end contract smoke
        run: python3 tests/contract_smoke.py ./skillrouter

  windows:
    name: Windows / MSVC
    runs-on: windows-latest
    defaults:
      run:
        working-directory: skill-router
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build router, C ABI, and tests
        shell: cmd
        run: build_windows_msvc.bat
      - name: Run C++ contract tests
        shell: cmd
        run: build\test_library.exe
      - name: Run C ABI smoke test
        shell: cmd
        run: build\test_c_api.exe
      - name: Run end-to-end contract smoke
        shell: cmd
        run: python tests\contract_smoke.py .\skillrouter.exe

  bindings:
    name: Language binding build checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and import Python binding
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel bindings/python
          python -m pip install bindings/python/dist/*.whl
          python -c "import skillrouter_native; print(skillrouter_native.__version__)"
      - name: Build and load Node N-API binding
        run: |
          npm install --prefix bindings/node
          npm test --prefix bindings/node
      - name: Build Rust bindgen wrapper
        run: |
          rustc --version
          cargo test --manifest-path bindings/rust/Cargo.toml
